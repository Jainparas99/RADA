[project]
name = "ratchet"
version = "0.1.0"
description = "A self-improving harness for MongoDB query tuning."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "jsonpatch>=1.33",
    "matplotlib>=3.9",
    "openai>=1.50",
    "pydantic>=2.8",
    "pymongo>=4.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.15",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
google = ["google-genai>=0.3"]
voyage = ["voyageai>=0.3"]

[project.scripts]
ratchet = "ratchet.cli:app"

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=8.3",
 "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # never reformat code blocks in docs

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option / typer.Argument in defaults
